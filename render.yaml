# Render Blueprint: New → Blueprint → select this repository.
services:
  - type: web
    name: tutortrack
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: tutortrack-db, property: connectionString }
      - key: APP_URL
        sync: false          # e.g. https://tutortrack.onrender.com
      - key: SMTP_URL
        sync: false          # e.g. smtps://user:pass@smtp.example.com:465 (password reset e-mails)
      - key: MAIL_FROM
        sync: false
databases:
  - name: tutortrack-db
    plan: free
    databaseName: tutortrack
