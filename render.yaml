# Render Blueprint (strona) + baza danych w Neon.
# Render: New → Blueprint → wybierz to repozytorium. Instrukcja: DEPLOY.md
services:
  - type: web
    name: tutortrack
    runtime: docker
    plan: free            # zmień na "starter", żeby strona nie „zasypiała”
    region: frankfurt     # dane w UE
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false       # adres bazy z Neon (Connection string, z ?sslmode=require)
      - key: APP_URL
        sync: false       # np. https://tutortrack.onrender.com
      - key: SMTP_URL
        sync: false       # opcjonalnie: poczta do resetu hasła
      - key: MAIL_FROM
        sync: false       # opcjonalnie: np. TutorTrack <no-reply@twojadomena.pl>
      - key: ADMIN_EMAILS
        sync: false       # e-mail(e) administratora, po przecinku – panel /admin
